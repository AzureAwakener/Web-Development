<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FGO | Servant Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Chaldea</a>
            <span class="navbar-text">Atlas Academy</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-primary text-white py-5">
        <div class="container text-center">
            <h1 class="display-5 fw-bold">Servant Database</h1>
            <p class="lead">Meet the heroes and legends of humanity.</p>
        </div>
    </header>

    <main class="container py-5">

        <!-- Search and Filters -->
        <section class="bg-white rounded shadow-sm p-4 mb-5">
            <h2 class="h4 mb-3">Find a Servant</h2>

            <form>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="servantSearch" class="form-label">
                            Servant Name
                        </label>
                        <input type="search" class="form-control" id="servantSearch"
                            placeholder="Search for a Servant...">
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="servantClass" class="form-label">
                            Class
                        </label>
                        <select class="form-select" id="servantClass">
                            <option selected>All Classes</option>
                            <option>Saber</option>
                            <option>Archer</option>
                            <option>Lancer</option>
                            <option>Rider</option>
                            <option>Caster</option>
                            <option>Assassin</option>
                            <option>Berserker</option>
                            <option>Extra Classes</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="servantRarity" class="form-label">
                            Rarity
                        </label>
                        <select class="form-select" id="servantRarity">
                            <option selected>All Rarities</option>
                            <option>1 Star</option>
                            <option>2 Stars</option>
                            <option>3 Stars</option>
                            <option>4 Stars</option>
                            <option>5 Stars</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <button type="button" class="btn btn-primary">
                            Search Servants
                        </button>
                        <button type="reset" class="btn btn-outline-secondary">
                            Reset
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Servant Collection -->
        <section class="mb-5">
            <div class="d-flex flex-wrap justify-content-between
                        align-items-center gap-2 mb-3">
                <div>
                    <h2 class="h3 mb-1">Featured Servants</h2>
                    <p class="text-secondary mb-0">
                        Explore some famous heroes and legends.
                    </p>
                </div>
            </div>

            <div class="row g-4" id="favoriteServants">
                <!-- API Data will be put here -->
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Chaldea | Fan-made project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>

</body>

</html>
