<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chaldea</title>
    <link rel="icon" href="images/icon.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <div class="container navbar">
        <a class="navbar-brand fw-bold"> Chaldea </a>
        <span class="navbar-text">Atlas Academy</span>
    </div>

    <div class="container-fluid text-center bg-primary text-white py-5 mb-3">
        <h1 class="display-5 fw-bold">Servant Database</h1>
        <p class="lead">Meet the heroes and legends of humanity.</p>
    </div>

    <div class="container py-5 bg-light rounded shadow-sm p-4 mb-5">
        <h2 class="h4 mb-3">Find a Servant</h2>

        <form id="servantFilterForm">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="servantSearch" class="form-label">
                        Servant Name
                    </label>
                    <input type="search" class="form-control" id="servantSearch" placeholder="Search for a Servant...">
                </div>

                <div class="col-6 col-md-3">
                    <label for="servantClass" class="form-label">
                        Class
                    </label>
                    <select class="form-select" id="servantClass">
                        <option selected>All Classes</option>
                        <option>Saber</option>
                        <option>Archer</option>
                        <option>Lancer</option>
                        <option>Rider</option>
                        <option>Caster</option>
                        <option>Assassin</option>
                        <option>Berserker</option>
                        <option>Ruler</option>
                        <option>Avenger</option>
                        <option>Mooncancer</option>
                        <option>Alterego</option>
                        <option>Foreigner</option>
                        <option>Pretender</option>
                        <option>Beast</option>
                        <option>Shielder</option>
                    </select>
                </div>

                <div class="col-6 col-md-3">
                    <label for="servantRarity" class="form-label">
                        Rarity
                    </label>
                    <select class="form-select" id="servantRarity">
                        <option selected>All Rarities</option>
                        <option>1 Star</option>
                        <option>2 Stars</option>
                        <option>3 Stars</option>
                        <option>4 Stars</option>
                        <option>5 Stars</option>
                    </select>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Search Servants
                    </button>
                    <button type="reset" class="btn btn-outline-secondary">
                        Reset
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="container mt-5 pt-5">
        <div class="h4 mb-4">Servant Index</div>
        <div>
            <ul class="pagination">
                <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
                <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
                <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
            </ul>
        </div>
    </div>

    <div class="container my-4">
        <div class="row">
            <div id="servantList" class="d-flex flex-column gap-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
